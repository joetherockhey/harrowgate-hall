<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case board · The Daily Corpse</title>
<meta name="description" content="A trail of ten-minute murder mysteries to solve alone or with friends. Solve one to open the next.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Special+Elite&family=Caveat:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="favicon.svg"><link rel="apple-touch-icon" href="icon-180.png"><link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#17130f"><meta name="apple-mobile-web-app-title" content="Daily Corpse">
</head>
<body class="board-page">
<div class="backdrop" id="backdrop" aria-hidden="true"></div>
<header class="board-bar">
  <h1><a href="index.html" style="color:inherit;text-decoration:none">The Daily <i>Corpse</i></a></h1>
  <span id="tally"></span>
</header>
<div class="board-intro"><p>Solve a case to open the next file. <a href="index.html">How it works</a></p></div>
<main class="board" id="board" aria-label="Case board"></main>
<section class="bonus">
  <h2>Bonus files</h2>
  <div class="cal" id="bonus"></div>
</section>
<footer>The Daily Corpse · works of fiction</footer>

<dialog id="lvl"><div class="sheet"><button class="x" aria-label="Close" onclick="this.closest('dialog').close()">×</button><div id="lvl-body"></div></div></dialog>

<script src="levels.js"></script>
<script>
{
  const $ = s => document.querySelector(s), ROW = 200, all = /[?&]all\b/.test(location.search) ? '&all' : '';
  const stars = n => `<span class="stars" aria-label="${n} of 3 stars">${'★'.repeat(n)}<i>${'★'.repeat(3 - n)}</i></span>`;
  // The warm-up sits at the foot of the cork, Case 1 above it, and the board climbs to one blank card at the top.
  const nodes = [{ ...WARMUP, warm: true, open: true, done: solvedCase(WARMUP.id) },
    ...LEVELS.map((l, i) => ({ ...l, n: i + 1, open: levelOpen(i), done: solvedCase(l.id) })), { soon: true }];
  // The lamp goes on the warm-up for a brand-new player, otherwise on the first open case not yet solved (skipping the warm-up is fine).
  const fresh = !nodes[0].done && !nodes.some(v => v.n && (v.done || caseSave(v.id).answers?.length));
  const cur = fresh ? 0 : nodes.findIndex(v => v.n && v.open && !v.done), H = nodes.length * ROW + 30, board = $('#board');
  const src = v => v.photo || `img/${v.id}/${v.pic || 'plan'}.jpg`, link = v => v.href || `case.html?c=${v.id}${all}`;
  $('#tally').textContent = `${nodes.filter(v => v.done).length} of ${LEVELS.length} solved`;
  board.style.height = H + 'px';
  const pos = i => ({ x: [28, 72, 34, 70, 26, 68, 36][i % 7], y: H - 150 - i * ROW, r: [-3, 4, -2, 3, -4, 2, -3][i % 7] });   // x in % of the column, y in px

  const trail = nodes.map((v, i) => {
    const { x, y, r } = pos(i);
    if (v.soon) return `<div class="pol soon" style="left:${x}%;top:${y}px;--r:${r}deg"><span class="pol-cap">More files soon</span></div>`;
    const cls = v.done ? 'done' : v.open ? 'open' : 'locked';
    return `${i === cur ? `<div class="lamp" style="left:${x}%;top:${y + 70}px"></div>` : ''}
      <button class="pol ${cls} ${i === cur ? 'cur' : ''}" type="button" style="left:${x}%;top:${y}px;--r:${r}deg" data-i="${i}"
        aria-label="${v.warm ? 'Warm-up' : 'Case ' + v.n}: ${v.open ? v.title : 'sealed'}${v.done ? ', solved' : ''}">
        <span class="pol-pic"><img src="${src(v)}" alt="" width="144" height="144" loading="lazy">${v.done ? '<b class="stamp">Solved</b>' : ''}${v.open ? '' : '<span class="seal" aria-hidden="true"></span>'}</span>
        <span class="pol-cap">${v.warm ? 'Warm-up:' : v.n + '.'} ${v.open ? v.title : 'Sealed'}</span>
        ${v.done ? stars(caseStars(v.id)) : ''}
      </button>
      ${i === cur ? `<span class="tag" style="left:${x}%;top:${y + 214}px">${caseSave(v.id).answers?.length ? 'Carry on' : 'Open the file'}</span>` : ''}`;
  }).join('');
  // Red string from pin to pin, drawn in column percent so it stays on the pins at any width: solid as far as you've got, faded beyond.
  const pts = nodes.map((_, i) => { const p = pos(i); return [p.x, p.y + 2]; });
  const seg = (a, b) => `M${a[0]},${a[1]} Q${(a[0] + b[0]) / 2},${(a[1] + b[1]) / 2 + 30} ${b[0]},${b[1]}`;
  const string = `<svg class="string" viewBox="0 0 100 ${H}" preserveAspectRatio="none" aria-hidden="true">${pts.slice(1).map((p, i) =>
    `<path d="${seg(pts[i], p)}" class="${nodes[i].done ? 'walked' : ''}" vector-effect="non-scaling-stroke"/>`).join('')}</svg>`;

  // Behind the whole page: three photographs of the cork with desk clutter down both sides, stacked from just under the
  // title bar to the bottom of the page and cross-faded briefly where they meet. Each photo is used exactly once, in an
  // order that keeps their busiest edges (the Clarion's masthead, the pipe) at the very top and bottom where nothing fades.
  // On phones only each photo's two edges show, at the sides of the screen.
  const SIDES = ['img/board/side3.jpg', 'img/board/side2.jpg', 'img/board/side1.jpg'], BLEND = 50;   // bottom to top
  board.innerHTML = `<div class="col">${string}${trail}</div>`;
  const backdrop = () => {
    const bd = $('#backdrop'), top0 = $('.board-bar').offsetHeight;
    const total = document.documentElement.scrollHeight - top0, W = document.documentElement.clientWidth, n = SIDES.length;
    const th = Math.round((total + BLEND * (n - 1)) / n), iw = th * 1.39, f = BLEND / th * 100;   // trimmed photos are about 1.39 : 1
    bd.style.height = total + top0 + 'px'; bd.style.paddingTop = top0 + 'px';   // the strip under the title bar stays dark
    bd.innerHTML = SIDES.map((u, k) => {
      const top = top0 + total - th - k * (th - BLEND);
      const fade = `--ft:${k === n - 1 ? 0 : f}%;--fb:${k === 0 ? 0 : f}%;top:${top}px;height:${th}px;background-image:url(${u})`;
      if (W >= 760) return `<div class="side" style="${fade}"></div>`;
      const sw = Math.round(W * .3);           // phones: the inner part of each photo's left and right bands, at the screen edges
      return `<div class="side l" style="${fade};width:${sw}px;background-size:${iw}px ${th}px;background-position:${sw - iw * .3}px 0"></div>
        <div class="side r" style="${fade};width:${sw}px;background-size:${iw}px ${th}px;background-position:${-iw * .7}px 0"></div>`;
    }).join('');
  };
  backdrop(); addEventListener('resize', backdrop);

  board.onclick = e => {
    const b = e.target.closest('.pol[data-i]'); if (!b) return;
    const v = nodes[b.dataset.i];
    $('#lvl-body').innerHTML = `<div class="kind">${v.warm ? 'Warm-up · about five minutes' : 'Case No. ' + v.n}</div>` + (v.open
      ? `<h2>${v.title}</h2><p>${v.tagline}</p>${v.done ? `<p>${stars(caseStars(v.id))} Solved</p>` : ''}
         ${v.warm ? '' : '<p class="aside">Solo or with friends · three stages · about ten minutes</p>'}
         <a class="btn" href="${link(v)}">${v.done ? 'Reopen the file' : caseSave(v.id).answers?.length ? 'Carry on' : 'Open the file'}</a>`
      : `<h2>Sealed</h2><p>Solve <b>Case ${v.n - 1}</b> to open this file.</p>`);
    $('#lvl').showModal();
  };
  if (!TESTS.length) $('.bonus').hidden = true;
  $('#bonus').innerHTML = TESTS.map(t => `<a class="day test" href="${t.href}"><span class="dow">Bonus</span><span class="dnum">${t.n}</span>
    <span class="dinfo"><b>${t.title}</b><small>${t.tagline}</small></span><span class="dstat">${solvedCase(t.id) ? '✓' : ''}</span></a>`).join('');
  // Open the board on the case you're up to.
  board.querySelector('.cur')?.scrollIntoView({ block: 'center' });
}
</script>
</body>
</html>
